name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 python3-serial python3-paramiko python3-scp python3-cryptography
      - run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 -m unittest -v
      - name: Verify Linux source installer and bundled smoke test
        run: |
          prefix="$(mktemp -d)"
          sh install-source.sh --prefix "$prefix"
          QT_QPA_PLATFORM=offscreen "$prefix/bin/serial-desk" --smoke-test "$prefix/smoke.json"
          /usr/bin/python3 -c "import json,runpy; r=json.load(open('$prefix/smoke.json')); assert r['version']==runpy.run_path('version.py')['VERSION'] and r['tabs']==5 and r['local_terminal']"
