name: Release
on:
  push:
    branches: [main]
    paths: [version.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 python3-serial python3-paramiko python3-scp python3-cryptography
      - run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 -m unittest -v
      - run: /usr/bin/python3 scripts/build-release.py
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(/usr/bin/python3 -c 'from version import VERSION; print(VERSION)')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; increment version.py for a new release."
            exit 0
          fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Serial Desk $VERSION" --notes-file CHANGELOG.md --latest
